<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">

<title>Dig &amp; Hop</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#17283c;color:#fff;font-family:system-ui;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}

canvas{display:block;background:#17283c}

.pad{display:flex;gap:14px;align-items:center}
#dpad{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:54px 1fr;width:176px;height:146px;border-radius:30px;background:rgba(233,240,255,.88);overflow:hidden;touch-action:none}
#dpad span{display:grid;place-items:center;font-size:30px;color:#17283c;pointer-events:none}
#dpad span:nth-child(-n+2){font-size:22px;background:rgba(23,40,60,.08);border-bottom:2px solid rgba(23,40,60,.15)}
#dpad span:nth-child(odd){border-right:2px solid rgba(23,40,60,.15)}
#dpad span.on{background:#ffdf50}
.btn{width:84px;height:84px;border-radius:50%;border:0;background:rgba(233,240,255,.88);color:#17283c;font:700 14px system-ui;display:grid;place-content:center;line-height:1.15;touch-action:none;padding:0}
.btn b{font-size:28px;display:block}
.btn.on{transform:scale(.92);background:#ffdf50}
#jump{width:100px;height:100px}
.topbtns{position:absolute;top:calc(env(safe-area-inset-top) + 8px);right:calc(env(safe-area-inset-right) + 8px);display:flex;gap:8px;z-index:5}
.topbtns button{width:44px;height:44px;border-radius:12px;border:0;background:rgba(23,40,60,.55);color:#fff;font-size:22px;padding:0;touch-action:none}
#music.off{opacity:.6}
.topbtns #changeBgm{width:auto;min-height:52px;height:auto;padding:6px 14px;background:#ffdf50;color:#17283c;border:2px solid #fff8;box-shadow:0 3px 0 #b58b18,0 4px 12px #0004;font:800 15px system-ui;touch-action:manipulation;line-height:1.3}
#changeBgm small{display:block;font:600 11px system-ui;margin-bottom:2px}

#changeBgm:focus-visible{outline:3px solid #fff;outline-offset:3px}
#startBtn{position:absolute;left:50%;top:60%;transform:translateX(-50%);z-index:6;font:900 32px system-ui;letter-spacing:2px;padding:14px 52px;border-radius:44px;border:0;background:#ffdf50;color:#20304a;box-shadow:0 6px 0 #c9971e,0 10px 24px #0006;touch-action:manipulation;animation:pulse 1.1s ease-in-out infinite}
#startBtn:active{transform:translateX(-50%) translateY(4px);box-shadow:0 2px 0 #c9971e}
@keyframes pulse{50%{scale:1.07}}
#fs{display:none}
.hint,.help{font-size:13px;opacity:.8;text-align:center;margin:8px 0 0}
.help{display:none}
@media (orientation:landscape){
  /* 左：方向パッド ／ 中央：ゲーム画面 ／ 右：掘る・ジャンプ（重ならない） */
  #stage{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:minmax(0,1fr);align-items:center;
    padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
  canvas{grid-column:2;grid-row:1;width:100%;height:100%;min-width:0;min-height:0;object-fit:contain}
  .controls{display:contents}
  .pad{grid-row:1;padding:0 10px}
  .controls .pad:first-child{grid-column:1}
  .controls .pad:last-child{grid-column:3;flex-direction:column-reverse;gap:12px}   /* 上：ジャンプ　下：掘る */
  #dpad{width:min(150px,19vw);height:min(140px,36vh);grid-template-rows:42% 1fr}
  .btn{width:min(80px,10vw,22vh);height:min(80px,10vw,22vh)}
  #jump{width:min(94px,12vw,26vh);height:min(94px,12vw,26vh)}
  .hint{display:none}
  .help{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 6px);left:50%;transform:translateX(-50%);margin:0}
}
@media (orientation:portrait){
  canvas{width:100%;height:auto;aspect-ratio:16/9;margin-top:env(safe-area-inset-top)}
  .controls{flex:1;align-items:center;gap:8px;padding:16px 12px calc(env(safe-area-inset-bottom) + 20px)}
  .pad{gap:10px}
  #dpad{width:min(184px,40vw);height:min(160px,36vw)}
  .topbtns{top:auto;bottom:calc(env(safe-area-inset-bottom) + 12px)}
  #startBtn{top:calc(env(safe-area-inset-top) + 56.25vw*.6 - 30px);font-size:26px;padding:12px 40px}
  .btn{width:min(92px,21vw);height:min(92px,21vw)}#jump{width:min(110px,25vw);height:min(110px,25vw)}
}
@media (hover:hover) and (pointer:fine){.help{display:block}.hint{display:none}}
</style></head><body>
<div id="stage">
<canvas id="game" width="960" height="540"></canvas>
<p class="hint">📱 横向きにすると大きく遊べます ・ 方向パッドの上段 ↖↗ でジャンプしながら移動</p>
<div class="controls">
  <div class="pad"><div id="dpad"><span>↖</span><span>↗</span><span>◀</span><span>▶</span></div></div>
  <div class="pad"><button class="btn" id="dig"><b>⛏</b>掘る</button><button class="btn" id="jump"><b>⬆</b>ジャンプ</button></div>
</div>
<p class="help">← → / A D 移動・スペースでジャンプ（移動キーと同時押しで斜めジャンプ）・X で穴掘り・M で音楽ON/OFF・R でやり直し</p>
<button id="startBtn">▶ START</button>
<div class="topbtns"><button id="changeBgm" aria-label="MP3に切替。現在は元のBGM" aria-pressed="false"><small>現在：元のBGM</small>♫ MP3に切替</button><button id="music" aria-label="音楽">🎵</button><button id="fs" aria-label="全画面">⛶</button></div>
</div>
<script>
const c=document.querySelector('canvas'),x=c.getContext('2d'),W=960,H=540,ground=465;
let world=4300,stage=1,AX=0,arenaOn=false,boss=null,rocks=[],waves=[],parts=[],shake=0,bannerText='',bannerSub='',bannerT=0,clearT=0,endT=0,stageStartScore=0;
let keys={},player,coins=[],enemies=[],platforms=[],camera=0,score=0,state='play',goalTick=0,audioCtx,deathTick=0,lives=3,holes=[],digCooldown=0,digHold=false,padJump=false,bgmStep=0,curSong=null,digBuf=0,digBufT=0,failMark=null,items=[],popups=[],spots=[];
const STARS=Array.from({length:90},(_,i)=>({x:(i*397)%W,y:(i*173)%380,s:1+(i%3),p:i}));
const CREDITS=['モグラ大王 ドリモグを たおした！','','谷に 光が もどり','空の国に 平和が おとずれた','','','— DIG & HOP —','','STAGE 1　そよかぜの丘','STAGE 2　大王の谷','','','HERO　あなた','','','THANK YOU FOR PLAYING!'];
const CREDITS_PAIR=['モグラ大王 ドリモグを たおした！','','とらわれていた ソラ姫を 助けだし','ふたりは 空の国で 結ばれた','','','— DIG & HOP —','','STAGE 1　そよかぜの丘','STAGE 2　大王の谷','','','HERO　あなた','PRINCESS　ソラ姫','','','おしあわせに！','','THANK YOU FOR PLAYING!'];
let endingPair=false;   // true：お姫様と2人のエンディング（50%の確率）
// レアエンディング（10%）：ドリモグが心を入れかえて友だちに
const CREDITS_RARE=['モグラ大王 ドリモグを たおした！','','……と 思ったら','ドリモグは 心を入れかえ','みんなの 友だちになった！','','ソラ姫も いっしょに','空の国で 大パーティー！','','','★ RARE ENDING ★','','— DIG & HOP —','','HERO　あなた','PRINCESS　ソラ姫','FRIEND　ドリモグ','','','これを見られたあなたは','とってもラッキー！','','THANK YOU FOR PLAYING!'];
let endingRare=false;
function credits(){return endingRare?CREDITS_RARE:endingPair?CREDITS_PAIR:CREDITS}

// ===== ステージ =====
function newPlayer(inv){return {x:60,y:300,w:34,h:42,vx:0,vy:0,on:false,inv:inv,facing:1,hole:null}}
// perch を渡すと空の踏み台の上から始まり、しばらく踏み台を往復してから地面へ降りる
function makeEnemy(x0,hop,i,perch){return {x:x0,y:perch?perch.y-32:ground-32,w:32,h:32,alive:true,dir:i%2?1:-1,vy:0,spawnX:x0,respawns:0,type:hop?'hop':'walk',speed:hop?1.3:.7,hopT:40+i*7,grounded:true,home:perch?null:x0,range:240,perchT:perch?240+Math.floor(Math.random()*240):0}}
function onSurface(px,y){return platforms.some(b=>Math.abs(b.y-y)<2&&px>=b.x&&px<=b.x+b.w)}
function groundAt(px){return platforms.some(b=>b.y===ground&&px>=b.x&&px<=b.x+b.w)}
function addPerchEnemies(idx){const floats=platforms.filter(b=>b.y<ground-1&&(stage!==2||b.x+b.w<AX));idx.forEach((k,i)=>{const f=floats[k];if(f)enemies.push(makeEnemy(f.x+f.w/2-16,i%2===1,i+20,f))})}
function banner(t,s,d=150){bannerText=t;bannerSub=s;bannerT=d}
function loadStage(n){
  stopStageClearAudio();
  stopBossSounds();
  stage=n;stageStartScore=score;try{if(n===1)mp3Restart('field1')}catch(_){}balls=[];cannonWarn=null;cannonT=60*8;lastSafeX=60;bonusUsed[n]=false;crossed1=false;leftHold=0;roomKind='basement';inBasement=false;surface=null;secret={x:n===1?2520:840,used:false};items=[];popups=[];spots=[];holes=[];digCooldown=0;deathTick=0;goalTick=0;camera=0;coins=[];enemies=[];platforms=[];rocks=[];waves=[];parts=[];boss=null;arenaOn=false;shake=0;
  if(n===1){
    world=4300;
    for(let i=0;i<world/240;i++){if(i!==5&&i!==11&&i!==15)platforms.push({x:i*240,y:ground,w:240,h:75});}
    for(let i=0;i<13;i++)platforms.push({x:320+i*285,y:325-(i%3)*40,w:115,h:18});
    for(let i=0;i<30;i++)coins.push({x:180+i*130,y:260+(i%4)*34,taken:false});
    for(let i=0;i<11;i++)enemies.push(makeEnemy(450+i*330,i%3===2,i));
    addPerchEnemies([1,4,7,10]);
    [[2,'gem'],[4,'coins'],[7,'heart'],[9,'gem'],[13,'chest'],[16,'gem']].forEach(([k,t])=>spots.push({x:k*240+120,type:t,found:false}));
    banner('STAGE 1','そよかぜの丘');
  }else{
    AX=2640;world=AX+960;
    for(let i=0;i<11;i++){if(i!==4&&i!==8)platforms.push({x:i*240,y:ground,w:240,h:75});}
    platforms.push({x:AX,y:ground,w:960,h:75});
    for(let i=0;i<8;i++)platforms.push({x:330+i*270,y:330-(i%3)*45,w:110,h:18});
    platforms.push({x:AX+170,y:320,w:110,h:18},{x:AX+680,y:320,w:110,h:18});
    for(let i=0;i<18;i++)coins.push({x:200+i*120,y:270+(i%4)*30,taken:false});
    [520,760,1320,1500,1700,1850,2250,2450].forEach((ex,i)=>enemies.push(makeEnemy(ex,i%2===1,i)));
    addPerchEnemies([1,3,6]);
    [[2,'gem'],[5,'heart'],[7,'coins'],[9,'chest']].forEach(([k,t])=>spots.push({x:k*240+120,type:t,found:false}));
    banner('STAGE 2','大王の谷');
  }
  player=newPlayer(120);state='play';resetTimer();timeBonus=0;   // スタート直後は2秒無敵
}
function reset(){score=0;lives=3;keys={};loadStage(1)}
function retry(){if(stage===2){score=stageStartScore;lives=3;keys={};loadStage(2)}else reset()}
function rect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function trappedIn(h){return enemies.some(e=>e.alive&&e.trapHole===h)||(boss&&boss.hole===h)}
function inHole(h){return enemies.filter(e=>e.alive&&e.trapHole===h)}

// ===== 連鎖ボーナス：1つの穴にまとめて埋めるほど高得点（1匹100／2匹400／3匹900／4匹1600） =====
const HOLE_MAX=4,HOLE_T=600;   // 穴が開いている時間（約10秒）
function popup(x0,y0,text,col='#fff',size=24,t=80){popups.push({x:x0,y:y0,text,col,size,t,max:t})}
function buryHole(h){const list=inHole(h),n=list.length;if(!n)return;list.forEach(e=>e.alive=false);const pts=100*n*n;score+=pts;
  if(n>1){popup(h.x+h.w/2,ground-70,n+'匹まとめて！ ×'+n,'#ffdf50',30,100);popup(h.x+h.w/2,ground-38,'+'+pts,'#fff',26,100);sound('chain');boom(h.x+h.w/2,ground,10*n,['#ffdf50','#fff','#ff9a3c']);shake=Math.max(shake,4+n*2)}
  else{popup(h.x+h.w/2,ground-40,'+'+pts,'#fff',22);sound('bury')}}

// ===== 宝物：キラキラ光る地面を掘ると出てくる =====
const ITEM_INFO={coin:{pts:10},gem:{pts:300},chest:{pts:1000},heart:{pts:0}};
function spawnItem(type,x0){items.push({type,x:x0,y:ground-14,vx:(Math.random()<.5?-1:1)*(1.5+Math.random()*2),vy:-9-Math.random()*2.5,t:720})}
function revealTreasure(h){
  const sp=spots.find(s=>!s.found&&s.x>=h.x-6&&s.x<=h.x+h.w+6);
  if(sp){sp.found=true;sparkleFx(h.x+h.w/2);if(sp.type==='coins')for(let i=0;i<5;i++)spawnItem('coin',h.x+h.w/2);else spawnItem(sp.type,h.x+h.w/2);popup(h.x+h.w/2,ground-50,'お宝発見！','#7fe3ff',26);sound('treasure');}
  else if(arenaOn){if(Math.random()<.08)spawnItem('heart',h.x+h.w/2)}
  else if(Math.random()<.18)spawnItem('coin',h.x+h.w/2)}
function sparkleFx(x0){boom(x0,ground,16,['#fff','#7fe3ff','#ffdf50'],5)}
function collectItem(it){const cx=it.x;
  if(it.type==='coin'){score+=10;sound('coin');}
  else if(it.type==='gem'){score+=300;popup(cx,it.y-20,'💎 +300','#7fe3ff',24);sound('treasure');sparkleFx(cx);}
  else if(it.type==='chest'){score+=1000;popup(cx,it.y-20,'宝箱！ +1000','#ffdf50',30,100);sound('treasure');boom(cx,it.y,30,['#ffdf50','#fff','#ff9a3c']);}
  else if(it.type==='heart'){lives=Math.min(9,lives+1);popup(cx,it.y-20,'1UP！','#ff6b8a',30,100);sound('oneup');}}
function updateItems(p){for(const it of items){it.t--;it.vy=Math.min(14,it.vy+.45);it.x+=it.vx;it.y+=it.vy;
    // 完成した穴の上なら穴の底まで落ちる（穴の中からでも拾える）。穴が閉じたら地面の上に戻る
    const hu=holes.find(h=>h.stage===3&&it.x>h.x+4&&it.x<h.x+h.w-4);
    if(hu){const fl=ground+hu.h-10;if(it.y>=fl){it.y=fl;it.vy=0;it.vx=0}}
    else if(it.vy>=0){if(it.y>ground-10&&it.y<ground+70&&it.vy<1&&platforms.some(b=>b.y===ground&&it.x>b.x&&it.x<b.x+b.w))it.y=ground-10;const b=platforms.find(b=>it.x>b.x&&it.x<b.x+b.w&&it.y+10>=b.y&&it.y+10-it.vy<=b.y+2);if(b){it.y=b.y-10;it.vy=0;it.vx*=.6}}
    if(Math.hypot(p.x+p.w/2-it.x,p.y+p.h/2-it.y)<30){it.got=true;collectItem(it)}
    if(it.y>H+60)it.t=0}
  items=items.filter(it=>it.t>0&&!it.got);
  for(const q of popups){q.t--;q.y-=.6}popups=popups.filter(q=>q.t>0)}

// MP3の共通音量。HTML AudioとWeb Audioで同じ値を使う。
const MP3_VOLUME=.2;

// ===== 効果音 =====
// ステージクリアのジングルはBGMの種類にかかわらず1回だけ再生する。
const stageClearAudio=new Audio('audio/stage-clear.mp3');
stageClearAudio.preload='auto';stageClearAudio.volume=MP3_VOLUME;
function stopStageClearAudio(){stageClearAudio.pause();stageClearAudio.currentTime=0}
const bossIntroAudio=new Audio('audio/boss-intro.mp3'),bossClearAudio=new Audio('audio/boss-clear.mp3');
for(const audio of [bossIntroAudio,bossClearAudio]){audio.preload='auto';audio.volume=MP3_VOLUME}
let bossClearDone=true;
function stopBossSounds(){for(const audio of [bossIntroAudio,bossClearAudio]){audio.pause();audio.currentTime=0}bossClearDone=true}
function playBossIntro(){if(mode!=='game')return;bossIntroAudio.currentTime=0;try{bossIntroAudio.play().catch(()=>{})}catch(_){}}
function playBossClear(){
  if(mode!=='game')return;
  bossClearDone=false;bossClearAudio.currentTime=0;
  bossClearAudio.onended=bossClearAudio.onerror=()=>{bossClearDone=true};
  try{bossClearAudio.play().catch(()=>{bossClearDone=true})}catch(_){bossClearDone=true}
}
function victoryMusic(){
  if(mode==='title')return;
  stopStageClearAudio();
  try{const playback=stageClearAudio.play();if(playback)playback.catch(()=>{if(mode==='game'&&state==='clear')originalVictoryMusic()})}
  catch(_){originalVictoryMusic()}
}
function originalVictoryMusic(){if(mode==='title')return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();const notes=[[523,0,.13],[659,.14,.13],[784,.28,.13],[1047,.43,.25],[784,.72,.12],[1047,.86,.4],[1175,1.32,.13],[1319,1.47,.13],[1568,1.63,.55]];const start=audioCtx.currentTime+.03;for(const [hz,at,dur] of notes){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.value=hz;g.gain.setValueAtTime(.0001,start+at);g.gain.exponentialRampToValueAtTime(.13,start+at+.015);g.gain.exponentialRampToValueAtTime(.0001,start+at+dur);o.connect(g);g.connect(audioCtx.destination);o.start(start+at);o.stop(start+at+dur+.02)}}catch(e){}}
// iPhone対策：①消音スイッチでも鳴るよう再生モードに ②指を離した瞬間に音声を解放 ③停止(interrupted)からの復帰
let silentEl=null;
function silentWavUrl(){const n=800,b=new ArrayBuffer(44+n),v=new DataView(b),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);for(let i=0;i<n;i++)v.setUint8(44+i,128);return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}
function unlockAudio(){try{if(mp3Cur){const m=mp3[mp3Cur];if(m&&musicOn&&!paused&&!document.hidden&&mp3Enabled&&m.engine==='el'&&m.el&&m.el.paused&&!m.elBad){const pr=m.el.play();if(pr&&pr.catch)pr.catch(()=>{});}}}catch(_){}
  try{
  if(navigator.audioSession){try{navigator.audioSession.type='playback'}catch(_){}}
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state!=='running')audioCtx.resume();
  if(!audioCtx._primed){const s=audioCtx.createBufferSource();s.buffer=audioCtx.createBuffer(1,1,22050);s.connect(audioCtx.destination);s.start(0);audioCtx._primed=true}
  // 古いiOS向け：無音の音声を流して再生モードに切り替える
  if(!navigator.audioSession&&!silentEl&&/iP(hone|ad|od)|Macintosh/.test(navigator.userAgent)&&'ontouchend' in document){silentEl=new Audio(silentWavUrl());silentEl.loop=true;silentEl.setAttribute('playsinline','');const pr=silentEl.play();if(pr&&pr.catch)pr.catch(()=>{silentEl=null})}
}catch(e){}}
['touchend','pointerup','click','keydown'].forEach(ev=>document.addEventListener(ev,unlockAudio,{capture:true,passive:true}));
function tone(hz,duration,type='square',volume=.09,delay=0,endHz=null){if(!audioCtx||mode==='title')return;try{let t=audioCtx.currentTime+delay,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(Math.max(1,hz),t);if(endHz)o.frequency.exponentialRampToValueAtTime(Math.max(1,endHz),t+duration);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(volume,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+duration+.02);}catch(e){}}
const vib={dig:12,stomp:30,bury:45,chain:[40,30,40,30,80],treasure:30,oneup:[30,30,30],hurt:[70,40,140],slam:40,bosshit:[60,30,90],boom:80};
function buzz(kind){try{if(vib[kind]&&navigator.vibrate)navigator.vibrate(vib[kind])}catch(e){}}

function mp3StartBuf(m,rate){mp3StopBuf(m);const c=m.cfg,src=audioCtx.createBufferSource();src.buffer=m.buf;src.loop=true;src.loopStart=c.loopStart||0;src.loopEnd=c.loopEnd||m.buf.duration;src.playbackRate.value=rate;
  if(!m.gain){m.gain=audioCtx.createGain();m.gain.gain.value=MP3_VOLUME;m.gain.connect(audioCtx.destination);}src.connect(m.gain);src.start(0,mp3Wrap(m,m.pos));m.src=src;m.lastCtxT=audioCtx.currentTime;}
function mp3Halt(key){const m=mp3[key];if(!m)return;if(m.src&&audioCtx)m.pos=mp3Wrap(m,m.pos+(audioCtx.currentTime-m.lastCtxT)*m.src.playbackRate.value);if(m.el&&!m.el.paused){try{m.el.pause()}catch(_){}}if(m.engine==='el'&&m.el)m.pos=m.el.currentTime;mp3StopBuf(m);}
function mp3Restart(key){const m=mp3[key];if(!m)return;m.pos=0;try{if(m.el)m.el.currentTime=0}catch(_){}if(m.src&&audioCtx){mp3StopBuf(m);}}
function mp3PlayEl(m){if(!m.el||m.elBad)return;try{m.el.currentTime=mp3Wrap(m,m.pos)}catch(_){}m.reqT=Date.now();m.elT0=m.el.currentTime;m.elOK=false;const pr=m.el.play();if(pr&&pr.catch)pr.catch(()=>{m.elBad=true});}
const BASE_DUR={field:60/140/2};
function mp3LoopCheck(){const m=mp3Cur&&mp3[mp3Cur];if(!m||m.engine!=='el'||!m.el||m.el.paused)return;const c=m.cfg;if(c.loopEnd&&m.el.currentTime>=c.loopEnd){try{m.el.currentTime-= (c.loopEnd-c.loopStart)}catch(_){}}}
function mp3Tick(){   // 戻り値 true：MP3（またはその準備中）なので、今までの曲は鳴らさない
  const s=currentSong(),want=(!paused&&musicOn&&!document.hidden&&mode==='game'&&audioCtx)?mp3Key(s):null;
  if(want!==mp3Cur){if(mp3Cur)mp3Halt(mp3Cur);mp3Cur=want;if(want){const m=mp3Get(want);if(m){m.started=false;}}}
  if(!want)return false;const m=mp3Get(want);if(!m)return false;
  mp3Load(m);
  const rate=Math.max(.5,Math.min(3,BASE_DUR[s]?BASE_DUR[s]/SONGS[s].dur():1));
  if(m.engine==='el'){
    if(m.elBad||(!m.elOK&&m.reqT&&Date.now()-m.reqT>1200)){if(m.el){try{m.pos=m.el.currentTime;m.el.pause()}catch(_){}}m.engine='buf';}
    else{
      if(!m.started||m.el.paused&&m.elOK){m.started=true;mp3PlayEl(m);}
      try{m.el.playbackRate=rate}catch(_){}
      if(!m.elOK&&!m.el.paused&&m.el.currentTime>m.elT0+.05)m.elOK=true;
      return true;}}
  // Web Audio で再生
  if(m.buf){if(audioCtx.state!=='running')return true;
    if(!m.src)mp3StartBuf(m,rate);
    else{const now=audioCtx.currentTime;m.pos=mp3Wrap(m,m.pos+(now-m.lastCtxT)*m.src.playbackRate.value);m.lastCtxT=now;m.src.playbackRate.value=rate;}
    return true}
  if(m.bufBad&&m.elBad)return false;            // どちらも使えない → 今までの曲
  if(m.bufBad)return false;
  return m.loading?(Date.now()-m.reqT<4000):false;   // 読み込み待ち（長すぎる時は今までの曲）
}
function bgmTick(){if(mp3Tick()){curSong=currentSong();bgmNext=0;return}if(!audioCtx||audioCtx.state!=='running')return;if(paused){bgmNext=0;return}const s=currentSong();if(s!==curSong){curSong=s;bgmStep=0;bgmNext=0}if(!s||!musicOn||document.hidden){bgmNext=0;return}const song=SONGS[s],now=audioCtx.currentTime;if(!bgmNext||bgmNext<now)bgmNext=now+.06;while(bgmNext<now+.15){song.step(bgmStep,bgmNext,song.dur());bgmNext+=song.dur();bgmStep=(bgmStep+1)%song.len}}

function boom(x0,y0,n,cols,spd=6){for(let i=0;i<n;i++)parts.push({x:x0,y:y0,vx:(Math.random()-.5)*spd,vy:-Math.random()*spd*.8,life:30+Math.random()*20,max:50,col:cols[i%cols.length],s:3+Math.random()*4,g:.2})}
function firework(){const cx=120+Math.random()*720,cy=70+Math.random()*190,hue=Math.floor(Math.random()*360);for(let i=0;i<46;i++){const a=i/46*Math.PI*2,v=2+Math.random()*2.2;parts.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:60+Math.random()*25,max:85,col:`hsl(${hue+Math.random()*40},100%,65%)`,s:3,g:.035})}}
function updateParts(){for(const q of parts){if(q.petal)q.vx=Math.sin(q.y*.025+q.x*.01)*.9;q.vy+=q.g;q.x+=q.vx;q.y+=q.vy;q.vx*=.99;q.life--}parts=parts.filter(q=>q.life>0)}
function drawParts(){for(const q of parts){x.globalAlpha=Math.max(0,Math.min(1,q.life/q.max*1.5));x.fillStyle=q.col;x.fillRect(q.x-q.s/2,q.y-q.s/2,q.s,q.s)}x.globalAlpha=1}

// ===== 操作 =====
// ボス戦では穴が大きくなる（幅100・深さ60）
// 掘れる場所を探す：掘りかけの穴があればそれを続ける。崖の端や隣の穴にかかる時は少しずらして掘れる場所を探す
function digSpot(){if(bossIntroLong())return null;if(inBasement)return null;
  const p=player;if(state!=='play'||!p.on||p.hole||Math.abs(p.y+p.h-ground)>=12)return null;
  const hw=arenaOn?100:48,hd=arenaOn?60:48,dir=p.facing===-1?-1:1,pc=p.x+p.w/2,center=pc+dir*(hw/2+28);
  const cur=holes.find(h=>h.stage<3&&Math.abs(h.x+h.w/2-center)<h.w/2+8&&(dir>0?(h.x+h.w>p.x+p.w-4&&h.x<p.x+p.w+110):(h.x<p.x+4&&h.x+h.w>p.x-110)));   /* 向いている側の穴だけ続きを掘る（左右対称） */if(cur)return {hole:cur};
  // 敵が入っている穴の前なら「埋める」
  const occ=holes.find(h=>h.stage===3&&Math.abs(h.x+h.w/2-center)<h.w/2+12&&inHole(h).length>0);if(occ)return {bury:occ};
  for(const off of[0,-8,-16,-22,8,16,24]){const c=center+dir*off;
    if(Math.abs(c-pc)<hw/2+6)continue;   // 足元に掘らない
    // 穴の範囲がすべて地面の上にあるか（地面の継ぎ目をまたいでもOK、崖にかかるのはNG）
    let ok=true;for(let sx=c-hw/2+.5;sx<=c+hw/2-.5;sx+=8)if(!groundAt(sx)){ok=false;break}if(!ok||!groundAt(c+hw/2-.5))continue;
    if(holes.some(e=>Math.abs(e.x+e.w/2-c)<(e.w+hw)/2+1))continue;
    return {x:c-hw/2,w:hw,h:hd};}
  return null}
function doDig(){const s=digSpot();if(!s)return false;
  if(s.bury){buryHole(s.bury);holes=holes.filter(h=>h!==s.bury);digCooldown=15;sound('dig');return true}
  let h=s.hole;if(!h){h={x:s.x,y:ground,w:s.w,h:s.h,t:HOLE_T,stage:0};holes.push(h);}h.stage++;h.t=HOLE_T;digCooldown=9;sound('dig');if(h.stage===3){revealTreasure(h);checkSecret(h);}return true}
// ボタン/キーを押したとき：連打や着地直前の入力も取りこぼさず、掘れない場所なら×を表示
function dig(){if(state!=='play'||inBasement||paused)return;
  if(digCooldown>0||!player.on){digBuf=Math.min(2,digBuf+1);digBufT=24;return}
  if(!doDig()){const p=player,dir=p.facing===-1?-1:1;failMark={x:p.x+p.w/2+dir*(arenaOn?78:52),t:30};tone(150,.08,'square',.05)}}
// 当たり判定は見た目より少し小さめ（かすっただけでミスにならない）
function hitBox(p){return {x:p.x+6,y:p.y+5,w:p.w-12,h:p.h-6}}
let deathCause='';
function die(cause=''){if(state!=='play')return;deathCause=cause;state='dying';deathTick=0;player.vx=0;player.vy=-12.5;player.on=false;sound('hurt');}
function clampToHole(p,h){p.x=Math.max(h.x+1,Math.min(h.x+h.w-p.w-1,p.x))}

// ===== ボス：モグラ大王 ドリモグ =====
// short=true は再挑戦時の短い登場（毎回長い演出を見なくてよい）
function newBoss(hp=3,short=false){return {x:AX+700,y:short?ground-88:ground+30,w:96,h:88,vx:0,vy:0,hp:hp,st:'intro',t:0,dir:-1,inv:0,flash:0,hole:null,landed:short,short}}
function bossIntroLong(){return arenaOn&&boss&&boss.st==='intro'&&!boss.short}
function bgo(st){boss.st=st;boss.t=0}
function throwRock(p){const b=boss,sx=b.x+b.w/2,sy=b.y+10,T=48+Math.random()*16,tx=p.x+p.w/2+(Math.random()*80-40),ty=ground-14,g=.35;rocks.push({x:sx,y:sy,vx:(tx-sx)/T,vy:(ty-sy-.5*g*T*T)/T,r:13});sound('throw')}
function bossEscape(){const b=boss;holes=holes.filter(h=>h!==b.hole);b.hole=null;b.y=ground-b.h;b.vy=-15;b.vx=b.x+b.w/2<AX+480?4.5:-4.5;bgo('escape')}
function updateBoss(p,oldY){
  const b=boss;b.t++;if(b.inv>0)b.inv--;if(b.flash>0)b.flash--;
  const phase=b.hp>=3?1:b.hp===2?2:3,L=AX,R=AX+960-b.w,top=ground-b.h;
  if(b.st==='intro'){if(b.t===1)playBossIntro();const cx=b.x+b.w/2;
    if(b.short){b.y=top;if(b.t>40){bgo('walk');banner('','穴を掘って 大王を落とし、頭をふめ！',120)}}
    else{b.pt=(b.pt||0)+1;if(!b.phase)b.phase='rumble';
      if(b.phase==='rumble'){b.y=ground+30;shake=Math.max(shake,2+b.pt/12);if(b.pt%5===0)boom(cx+(Math.random()-.5)*90,ground,3,['#c9a27a','#8a6a4a'],4);if(b.pt===1||b.pt===40)sound('rumble');   // ゴゴゴ…地鳴り
        if(b.pt>=80){b.phase='burst';b.pt=0;b.y=ground-10;b.vy=-13.5;shake=30;sound('slam');sound('boom');boom(cx,ground,46,['#c9a27a','#8a6a4a','#5e3a22'],10);}}   // 地面を突き破る
      else if(b.phase==='burst'){b.vy+=.6;b.y+=b.vy;if(b.y>=top&&b.vy>0){b.y=top;b.vy=0;b.landed=true;shake=20;sound('slam');boom(cx,ground,18,['#c9a27a','#8a6a4a'],6);b.phase='pinwait';b.pt=0;}}
      else if(b.phase==='pinwait'){if(b.pt>14){b.phase='pin';b.pt=0;b.vx=-13.5;b.vy=-19;b.pins=0;sound('boing');}}
      // ピンボールのように跳ね回る
      else if(b.phase==='pin'){b.vy+=.45;b.x+=b.vx;b.y+=b.vy;b.spin=(b.spin||0)+b.vx*.035;let hit=null;
        if(b.x<=L){b.x=L;b.vx=Math.abs(b.vx);hit=[b.x,b.y+b.h/2];}
        if(b.x>=R){b.x=R;b.vx=-Math.abs(b.vx);hit=[b.x+b.w,b.y+b.h/2];}
        if(b.y<=70){b.y=70;b.vy=Math.abs(b.vy)*.95;hit=[b.x+b.w/2,b.y];}
        if(b.y>=top&&b.vy>0){b.y=top;
          if(b.pt>170&&Math.abs(b.x+b.w/2-(p.x+p.w/2))>300){b.phase='settle';b.pt=0;b.vx=0;b.vy=0;b.spin=0;shake=24;sound('slam');boom(b.x+b.w/2,ground,22,['#c9a27a','#8a6a4a'],7);}
          else{b.vy=-Math.max(16.5,Math.abs(b.vy)*.97);hit=[b.x+b.w/2,ground];}}
        if(hit){b.pins++;shake=Math.max(shake,8);pinSound(b.pins);boom(hit[0],hit[1],12,['#fff','#ffdf50','#7fe3ff'],7);b.flash=6;popup(Math.max(AX+50,Math.min(AX+910,hit[0])),Math.max(110,hit[1]-12),['ドン！','バン！','ガン！','ボヨン！'][b.pins%4],'#ffdf50',26,32);}}
      else if(b.phase==='settle'){b.y=top;if(b.pt>=28){sound('roar');shake=14;b.phase='roar';b.pt=0;}}                 // 雄たけび
      else if(b.phase==='roar'){if(b.pt>115){bgo('walk');banner('','穴を掘って 大王を落とし、頭をふめ！',140)}}}}
  else if(b.st==='walk'){const tx=p.x+p.w/2-(b.x+b.w/2);if(Math.abs(tx)>8)b.dir=Math.sign(tx);b.x+=b.dir*(.8+phase*.45);
    if(b.t>(phase===3?60:phase===2?85:110)){const r=Math.random();
      if(phase===1){if(r<.5){bgo('jump');b.vy=-15;b.vx=Math.max(-5,Math.min(5,tx/45))}else bgo('throw')}
      else if(r<.33){bgo('jump');b.vy=-15.5;b.vx=Math.max(-6,Math.min(6,tx/42))}
      else if(r<.6)bgo('throw');
      else{bgo('windup');b.dir=Math.sign(tx)||b.dir}}}
  else if(b.st==='jump'||b.st==='escape'){b.vy+=.7;b.x+=b.vx;b.y+=b.vy;if(b.y>=top&&b.vy>0){b.y=top;b.vy=0;b.vx=0;if(b.st==='jump'){shake=18;sound('slam');const sp=4+phase;waves.push({x:b.x+b.w/2-30,dir:-1,sp},{x:b.x+b.w/2+30,dir:1,sp});boom(b.x+b.w/2,ground,10,['#c9a27a'])}bgo('walk')}}
  else if(b.st==='throw'){if(b.t===30||(phase>=2&&b.t===48)||(phase===3&&b.t===66))throwRock(p);if(b.t>95)bgo('walk')}
  else if(b.st==='windup'){if(b.t%6===0)boom(b.x+b.w/2-b.dir*40,ground,2,['#c9a27a'],3);if(b.t>45)bgo('charge')}
  else if(b.st==='charge'){b.x+=b.dir*(4.5+phase);if(b.t%4===0)boom(b.x+b.w/2-b.dir*40,ground,2,['#c9a27a'],3);if(b.x<=L||b.x>=R){shake=14;sound('slam');bgo('walk')}}
  else if(b.st==='stun'){b.y=top+40;if(b.t>(phase===3?150:210))bossEscape()}
  else if(b.st==='dead'){b.vy+=.3;b.y+=b.vy;if(b.t<=210&&b.t%8===0){boom(b.x+Math.random()*b.w,Math.min(ground,b.y+Math.random()*b.h),12,['#ffdf50','#ff655e','#fff']);if(b.t%16===0)sound('boom')}
    if(b.t>210&&!b.clearPlayed){b.clearPlayed=true;playBossClear();banner('GAME CLEAR!','モグラ大王 ドリモグを たおした！',300)}
    // 読み込み失敗時や再生停止時にも進行を止めない（最大8秒）。
    if(b.t>210&&(bossClearDone||b.t>690)){bossClearAudio.pause();state='ending';endT=0;parts=[];addTimeBonus();score+=lives*1000;{const r=Math.random();endingRare=r<.1;endingPair=!endingRare&&r<.55;endP=null;if(endingRare)score+=5000;}/* レア10%・2人45%・1人45% */}return}
  b.x=Math.max(L,Math.min(R,b.x));
  // 完成した穴の上を歩く・突進すると落ちる
  if(b.st==='walk'||b.st==='charge'){const cx=b.x+b.w/2,h=holes.find(h=>h.stage===3&&Math.abs(h.x+h.w/2-cx)<Math.max(12,h.w/2-28)&&!enemies.some(e=>e.alive&&e.trapHole===h));
    if(h){b.hole=h;b.x=h.x+h.w/2-b.w/2;b.y=top+40;bgo('stun');shake=12;sound('bury');banner('','いまだ！ 頭をふめ！',80);if(p.hole===h&&p.inv<=0)die('大王が穴に落ちてきた！');}}
  // プレイヤーとの当たり判定
  if(b.landed&&b.st!=='intro'){const br={x:b.x+10,y:b.y+8,w:b.w-20,h:b.h-8};
    if(rect(p,br)){const fromAbove=oldY+p.h<=br.y+18&&p.vy>0;
      if(fromAbove){
        if(b.st==='stun'&&b.inv<=0){b.hp--;b.inv=50;b.flash=40;score+=500;p.vy=-13;p.inv=Math.max(p.inv,75);
          // 踏んだら、ボスが飛び出す方向と反対側へ大きく弾き飛ばされる
          {const esc=b.x+b.w/2<AX+480?1:-1;p.kickVx=-esc*5.5;p.kickT=40;p.facing=-esc;}shake=16;sound('bosshit');boom(p.x+p.w/2,b.y+10,14,['#fff','#ffdf50']);
          if(b.hp<=0){holes=holes.filter(h=>h!==b.hole);b.hole=null;bgo('dead');b.vy=-9;sound('boom');banner('','',0)}else bossEscape()}
        else{p.vy=-11;p.inv=Math.max(p.inv,20);sound('bounce')}}
      else if(b.st!=='stun'&&p.inv<=0&&rect(hitBox(p),br))die('大王にぶつかった！')}}
  // 投げた岩
  for(const r of rocks){r.vy+=.35;r.x+=r.vx;r.y+=r.vy;if(Math.hypot(p.x+p.w/2-r.x,p.y+p.h/2-r.y)<r.r+12&&p.inv<=0)die('岩に当たった！');if(r.y>ground-r.r){r.dead=true;boom(r.x,ground,6,['#8a8a8a','#c9a27a'],4)}}
  rocks=rocks.filter(r=>!r.dead);
  // 地面を走る衝撃波（穴の中なら当たらない）
  for(const w of waves){w.x+=w.dir*w.sp;if(rect(hitBox(p),{x:w.x-14,y:ground-28,w:28,h:28})&&p.inv<=0)die('衝撃波に当たった！');if(w.x<AX-20||w.x>AX+980)w.dead=true}
  waves=waves.filter(w=>!w.dead);
}

// ===== 更新 =====
function update(){
if(mode==='title'){demoT++;if(state==='play')demoAI();else if(state!=='goal'&&state!=='dying')return startDemo();if(demoT>60*(stage===2?75:45))return startDemo();}
if(bannerT>0)bannerT--;if(shake>0)shake--;updateParts();
if(state==='ending'){endT++;updateEndPlayer();if(endT%(endingRare?24:endingPair?55:38)===0)firework();if(endingRare&&endT%3===0)parts.push({x:realRandom()*W,y:-10,vx:(realRandom()-.5)*2,vy:1.5+realRandom()*1.5,life:360,max:360,col:`hsl(${Math.floor(realRandom()*360)},90%,62%)`,s:6,g:.01,petal:true});if(endingPair&&endT%6===0)parts.push({x:realRandom()*W,y:-10,vx:(realRandom()-.5)*.8,vy:.8+realRandom()*.8,life:400,max:400,col:['#ffc0d6','#ffd6e6','#fff0f5','#ffb3c8'][Math.floor(realRandom()*4)],s:5,g:.004,petal:true});return}
if(state==='clear'){clearT++;if(clearT>240)loadStage(2);return}
if(state==='dying'){deathTick++;player.vy+=.52;player.y+=player.vy;if(deathTick>105||player.y>H+110){lives--;if(lives>0){respawnHere();}else{state='lose';gameOverMusic();}}return;}
if(state==='goal'){goalTick++;const p=player,bx=world-120;
  if(goalTick<=28){const k=goalTick/28;p.x=goalSX+(bx-17-goalSX)*k;p.y=goalSY+(ground-38-28-goalSY)*k-Math.sin(k*Math.PI)*70;}   // ゴンドラに飛び乗る
  else{if(goalTick>45){balloonVy=Math.min(4.2,balloonVy+.045);balloonLift+=balloonVy;}if(goalTick===32||goalTick%26===0)sound('burner');p.x=bx-17;p.y=ground-38-28-balloonLift;}
  if(goalTick>230){state='clear';clearT=0;addTimeBonus();victoryMusic();}return;}
if(state!=='play')return;
const p=player;
if(mode==='game'&&!bossIntroLong()&&timeLeft>0&&arenaOn&&!inBonus())timeLeft--;   // ボス戦：減るだけでミスにはならない
else if(mode==='game'&&!bossIntroLong()&&timeLeft>0&&!inBonus()){timeLeft--;
  if(timeLeft===30*60&&!hurryShown){hurryShown=true;banner('','あと30秒！ いそげ！',100);sound('hurry');}
  if(timeLeft<=30*60&&timeLeft>0&&timeLeft%60===0){if(timeLeft<=10*60){tone(1175,.09,'square',.07);tone(880,.09,'square',.05,.12);}else tone(880,.06,'square',.035);}   // 残り30秒から1秒ごとにピッ（10秒からはピピッ）
  if(timeLeft===0){die('時間切れ！');return;}}
if(digCooldown>0)digCooldown--;
if(digBufT>0&&--digBufT===0)digBuf=0;
{const s=digCooldown===0&&(digBuf>0||digHold)?digSpot():null;if(s&&(digBuf>0||!s.bury)){if(digBuf>0)digBuf--;doDig();}}  // 長押しでは埋めない（タップで埋める）
if(failMark&&--failMark.t<=0)failMark=null;

// 穴のタイマー：プレイヤーやボスが中にいる穴は塞がらない
for(const h of holes){if(p.hole===h&&(p.y+p.h<ground-2||p.x+p.w<h.x||p.x>h.x+h.w))p.hole=null;if(p.hole===h||(boss&&boss.hole===h))continue;h.t--;if(h.stage===3&&h.t<=0)buryHole(h);}
updateItems(p);
holes=holes.filter(h=>h.t>0);

const oldY=p.y;if(p.inv>0)p.inv--;
if(p.kickT>0){p.kickT--;p.vx=p.kickVx;if(p.on&&p.kickT<20)p.kickT=0;}   // 弾き飛ばされ中は操作より優先
else{p.vx=(keys.right?4.4:0)-(keys.left?4.4:0);if(p.vx)p.facing=Math.sign(p.vx);}
// 地下室・ボーナスから戻った直後は、押しっぱなしの移動を少しだけ無視（指を離せばすぐ動ける）
if(p.moveLock>0){if(!keys.left&&!keys.right)p.moveLock=0;else{p.moveLock--;p.vx=0;}}
if(bossIntroLong()){p.vx=0;}else if((keys.jump||padJump)&&p.on){p.vy=-16.5;p.on=false;sound('jump');}
p.vy=Math.min(16,p.vy+.65);
p.x=Math.max(arenaOn?AX:0,Math.min(world-p.w,p.x+p.vx));
if(mode==='game'&&stage===2&&!inBasement&&!arenaOn&&!bonusUsed[2]){if(p.x<=0&&keys.left&&p.on){leftHold++;if(leftHold===20)popup(30,ground-70,'…？','#fff',22,40);if(leftHold>45){leftHold=0;enterBonus('sky',60);return;}}else leftHold=0;}
if(p.hole&&p.y+p.h>ground-2)clampToHole(p,p.hole);
p.y+=p.vy;p.on=false;
if(p.hole&&p.y+p.h<=ground-2)p.hole=null;
if(p.hole){const floor=ground+p.hole.h;if(p.y+p.h>=floor){p.y=floor-p.h;p.vy=0;p.on=true;if(p.hole.secret&&!inBasement){enterBasement(p.hole);return;}}}
else if(p.vy>=0){const cx=p.x+p.w/2;
  const pit=(oldY+p.h<=ground+10&&p.y+p.h>=ground)?holes.find(h=>h.stage===3&&cx>h.x+4&&cx<h.x+h.w-4&&!trappedIn(h)):null;
  if(pit){p.hole=pit;clampToHole(p,pit);}
  else for(const b of platforms){if(rect(p,b)&&oldY+p.h<=b.y+10){p.y=b.y-p.h;p.vy=0;p.on=true;}}}

if(!inBasement&&p.on&&!p.hole&&Math.abs(p.y+p.h-ground)<2&&groundAt(p.x+2)&&groundAt(p.x+p.w-2)&&!holes.some(h=>p.x+p.w>h.x-4&&p.x<h.x+h.w+4))lastSafeX=p.x;
for(const coin of coins){if(!coin.taken&&Math.hypot(p.x+p.w/2-coin.x,p.y+p.h/2-coin.y)<30){coin.taken=true;score+=10;sound('coin');}}

for(const e of enemies){if(!e.alive)continue;
  if(e.trapHole){const list=inHole(e.trapHole),k=list.indexOf(e),n=list.length;e.x=e.trapHole.x+(e.trapHole.w-e.w)/2+(k-(n-1)/2)*9;e.y=ground+3;e.vy=0;continue;}
  // 足場の端では引き返す（地面では崖に落ちない・遠くへ行きすぎない）
  let perched=false;
  if(e.grounded){const surfY=e.y+e.h;perched=surfY<ground-1;
    if(perched){if(e.perchT>0&&e.x>camera-40&&e.x<camera+W+40)e.perchT--;}else{if(e.home===null)e.home=e.x;e.perchT=0;}
    const look=e.type==='hop'?52:8,aheadOf=d=>e.x+(d>0?e.w+look:-look);
    // 近くにプレイヤーがいたら寄ってくる（崖の向こうへは行かない）。プレイヤーが穴の中にいる時は追わない
    const dx=p.x+p.w/2-(e.x+e.w/2);
    e.chasing=!perched&&!p.hole&&Math.abs(dx)<420&&Math.abs(dx)>4&&p.y+p.h>=ground-90&&onSurface(aheadOf(Math.sign(dx)),surfY);
    if(e.chasing){e.dir=Math.sign(dx);e.home=e.x;}
    else if((!perched||e.perchT>0)&&!onSurface(aheadOf(e.dir),surfY))e.dir*=-1;
    else if(!perched&&Math.abs(e.x-e.home)>e.range&&Math.sign(e.x-e.home)===e.dir)e.dir*=-1;}
  else e.chasing=false;
  if(e.type==='hop'&&e.grounded&&!(perched&&e.perchT>0)&&--e.hopT<=0){e.vy=-10.5;e.grounded=false;e.hopT=55+Math.floor(Math.random()*50);}
  if(e.safe>0)e.safe--;
  e.x+=e.dir*(e.kick>0?3.2:e.speed*(e.chasing?1.45:1));if(e.kick>0)e.kick--;
  if(e.x<0||e.x>world-e.w){e.dir*=-1;e.x=Math.max(0,Math.min(world-e.w,e.x));}
  const ecx=e.x+e.w/2;
  const trap=e.vy>=0?holes.find(h=>h.stage===3&&ecx>h.x+3&&ecx<h.x+h.w-3&&e.y+e.h>=ground-12&&e.y+e.h<=ground+18&&!(boss&&boss.hole===h)&&inHole(h).length<HOLE_MAX):null;
  if(trap){e.trapHole=trap;e.x=trap.x+(trap.w-e.w)/2;e.y=ground+3;e.vy=0;sound('stomp');{const n=inHole(trap).length;if(n>1){popup(trap.x+trap.w/2,ground-90,n+'匹目！','#ffdf50',26,60);tone(523+n*130,.12,'square',.07)}trap.t=Math.max(trap.t,150);}if(p.hole===trap&&p.inv<=0)die('穴に敵が落ちてきた！');continue;}
  const foot=e.y+e.h;
  const support=e.vy>=0?platforms.find(b=>e.x+e.w>b.x&&e.x<b.x+b.w&&foot<=b.y+12&&foot>=b.y-18):null;
  if(support){e.y=support.y-e.h;e.vy=0;e.grounded=true;}else{e.grounded=false;e.vy=Math.min(14,e.vy+.65);e.y+=e.vy;}
  // 崖に落ちた敵は、近くの空の踏み台に降ってきて再登場
  if(e.y>H+100){const floats=platforms.filter(b=>b.y<ground-1&&(stage!==2||b.x+b.w<AX));
    const pl=floats.reduce((best,b)=>!best||Math.abs(b.x+b.w/2-e.spawnX)<Math.abs(best.x+best.w/2-e.spawnX)?b:best,null);
    e.x=pl.x+pl.w/2-e.w/2;e.y=pl.y-e.h-140;e.vy=0;e.respawns++;e.grounded=false;e.dir=e.respawns%2?1:-1;e.home=null;e.perchT=240+Math.floor(Math.random()*180);continue;}
  if(rect(p,e)){if(oldY+p.h<=e.y+14&&p.vy>0){e.alive=false;p.vy=-9;score+=e.type==='hop'?80:50;sound('stomp');}
    // 上から降ってきた敵が頭に当たっても、ミスにせず跳ね返す
    else if(e.vy>1&&e.y+e.h-e.vy<=p.y+12){e.vy=-7;e.dir=(e.x+16<p.x+p.w/2)?-1:1;e.kick=30;e.safe=50;e.grounded=false;sound('bounce');popup(e.x+16,e.y-6,'ポン！','#fff',18,40);}
    else if(p.inv<=0&&!(e.safe>0)&&rect(hitBox(p),e)){die('敵にぶつかった！');}}
}

// ボスエリア突入
if(stage===2&&!inBasement&&!arenaOn&&p.x>AX+60){arenaOn=true;boss=newBoss();bannerT=0;timeLeft=BOSS_TIME*60;enemies.forEach(e=>e.alive=false);holes=holes.filter(h=>h.x>AX);}
if(arenaOn&&boss)updateBoss(p,oldY);

if(inBasement&&roomKind==='basement'&&p.x+p.w>W-80&&state==='play'){exitBasement();return;}
if(inBonus()&&state==='play'){roomT--;
  if(roomKind==='rain'&&roomT>20&&roomT%7===0){const r=Math.random();items.push({type:r<.03?'heart':r<.12?'gem':'coin',x:40+Math.random()*(W-80),y:-20,vx:(Math.random()-.5)*1.2,vy:1,t:300});}
  if(roomT<=0){exitBasement();return;}}
if(mode==='game'&&stage===1&&!inBasement&&p.on&&p.x>1450)crossed1=true;
if(mode==='game'&&stage===1&&!inBasement&&crossed1&&!bonusUsed[1]&&p.y>H+10&&p.x+p.w/2>1190&&p.x+p.w/2<1450){enterBonus('rain',1580);return;}
updateCannon(p,oldY);if(state!=='play')return;
if(p.y>H+80)die('落ちてしまった！');
if(stage===1&&!inBasement&&state==='play'&&p.x+p.w>world-158){state='goal';goalTick=0;goalSX=p.x;goalSY=p.y;balloonLift=0;balloonVy=0;p.vy=0;p.hole=null;p.facing=1;sound('jump');}
camera=arenaOn?AX:Math.max(0,Math.min(world-W,p.x-240));}

  }else if(endingPair){const bx=W/2-48,by=ground-42-Math.abs(Math.sin(endT*.06))*8,py2=ground-46-Math.abs(Math.sin(endT*.06+.5))*8;
    // 花のアーチ
    x.strokeStyle='#fff8';x.lineWidth=6;x.beginPath();x.arc(W/2,ground,120,Math.PI,0);x.stroke();for(let k=0;k<=12;k++){const a=Math.PI+k*Math.PI/12;x.fillStyle=['#ff9ad5','#fff','#ffd84d'][k%3];x.beginPath();x.arc(W/2+Math.cos(a)*120,ground+Math.sin(a)*120,6,0,7);x.fill();}
    drawEndPlayer();drawPartner(W/2+14,py2,endP&&endP.x+17>W/2+31?1:-1);
    const hb=1+Math.sin(endT*.12)*.15;drawHeart(W/2,ground-100-Math.sin(endT*.05)*6,13*hb,'#ff4d6d');
  }else{drawEndPlayer();}
  x.textAlign='center';x.fillStyle='#fff';x.shadowColor='#000';x.shadowBlur=6;
  const sy=creditsY();
  credits().forEach((l,i)=>{const y=sy+i*46;if(y>-40&&y<ground-60){x.font=(i===0||l.startsWith('—'))?'bold 34px system-ui':'26px system-ui';x.fillText(l,W/2,y)}});
  if(endingDone()){x.font='bold 64px system-ui';x.fillStyle='#ffdf50';x.fillText('THE END',W/2,190);x.fillStyle='#fff';x.font='bold 28px system-ui';x.fillText('FINAL SCORE  '+score,W/2,245);x.font='22px system-ui';if(Math.floor(endT/30)%2)x.fillText('タップで もういちど あそぶ',W/2,300);}
  x.shadowBlur=0;x.textAlign='left';
}

// 固定60fps：120Hz画面のスマホでも速くならない
// ===== 一時停止（ゲーム中に画面をタップ） =====
let paused=false;
function canPause(){return mode==='game'&&state==='play'}
function clearInput(){keys.left=keys.right=keys.jump=false;padJump=false;digHold=false;digBuf=0;document.querySelectorAll('.on').forEach(el=>el.classList.remove('on'))}
function setPause(on){if(on&&!canPause())return;if(paused===on)return;paused=on;clearInput();if(on)tone(520,.08,'square',.05);else tone(780,.08,'square',.05);}
function drawPause(){x.fillStyle='#0009';x.fillRect(0,0,W,H);x.textAlign='center';x.fillStyle='#fff';x.font='900 72px system-ui';x.fillText('PAUSE',W/2,250);
  x.font='bold 24px system-ui';x.fillText('画面をタップで さいかい',W/2,305);x.font='18px system-ui';x.fillStyle='#cfd8ea';x.fillText('SCORE '+score+'　　♥ × '+lives,W/2,350);x.textAlign='left';}
const STEP=1000/60;let last=0,acc=0;
function loop(t){if(!last)last=t;acc+=Math.min(100,t-last);last=t;if(paused)acc=0;while(acc>=STEP){update();acc-=STEP;}mp3LoopCheck();draw();if(mode==='title')drawTitle();if(paused)drawPause();requestAnimationFrame(loop)}
toTitle();
requestAnimationFrame(loop);

// キーボード
document.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(mode==='title'){if(k==='enter'||k===' '){e.preventDefault();startGame();}if(k==='m'&&!e.repeat){unlockAudio();setMusic(!musicOn);}return}if(k==='p'||k==='escape'){if(!e.repeat)setPause(!paused);return}if(paused)return;if(['arrowleft','a','arrowright','d',' ','arrowup','w'].includes(k))unlockAudio();if(['arrowleft','a'].includes(k))keys.left=true;if(['arrowright','d'].includes(k))keys.right=true;if([' ','arrowup','w'].includes(k)){keys.jump=true;e.preventDefault()}if(k==='x'){unlockAudio();if(!e.repeat)dig();}if(k==='m'&&!e.repeat){unlockAudio();setMusic(!musicOn);}if(k==='r'){if(state==='lose')retry();else reset()}});
document.addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(['arrowleft','a'].includes(k))keys.left=false;if(['arrowright','d'].includes(k))keys.right=false;if([' ','arrowup','w'].includes(k))keys.jump=false});

// 方向パッド：下段で移動、上段（↖↗）でジャンプしながら移動。指を離さずスライドで切り替え
const dpad=document.getElementById('dpad'),[dul,dur,dl,dr]=dpad.children;let dpadId=null;
function dpadSet(e){const r=dpad.getBoundingClientRect(),right=e.clientX>r.left+r.width/2,up=e.clientY<dul.getBoundingClientRect().bottom;keys.left=!right;keys.right=right;padJump=up;dl.classList.toggle('on',!right&&!up);dr.classList.toggle('on',right&&!up);dul.classList.toggle('on',!right&&up);dur.classList.toggle('on',right&&up)}
function dpadEnd(e){if(e.pointerId!==dpadId)return;dpadId=null;keys.left=keys.right=false;padJump=false;for(const s of dpad.children)s.classList.remove('on')}
dpad.addEventListener('pointerdown',e=>{e.preventDefault();if(mode==='title')return;unlockAudio();dpadId=e.pointerId;try{dpad.setPointerCapture(e.pointerId)}catch(_){}dpadSet(e)});
dpad.addEventListener('pointermove',e=>{if(e.pointerId===dpadId)dpadSet(e)});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>dpad.addEventListener(ev,dpadEnd));

// ボタン（マルチタッチ対応）
function holdButton(el,down,up){let id=null;el.addEventListener('pointerdown',e=>{e.preventDefault();if(mode==='title')return;unlockAudio();id=e.pointerId;try{el.setPointerCapture(id)}catch(_){}el.classList.add('on');down()});const end=e=>{if(e.pointerId!==id)return;id=null;el.classList.remove('on');up()};['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,end))}
holdButton(document.getElementById('jump'),()=>keys.jump=true,()=>keys.jump=false);
holdButton(document.getElementById('dig'),()=>{dig();},()=>{}); // 1タップにつき1回だけ掘る。デモAIの自動掘削は維持

c.addEventListener('pointerdown',()=>{if(mode==='title')return;unlockAudio();if(paused){setPause(false);return}if(state==='lose')retry();else if(state==='ending'&&endingDone())toTitle();else if(canPause())setPause(true);});

// スクロール・ズーム・長押しメニューを防止
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());

// アプリ切替時に入力をリセット
document.addEventListener('visibilitychange',()=>{if(document.hidden)setPause(true);try{if(!document.hidden&&audioCtx&&audioCtx.state!=='running')audioCtx.resume()}catch(_){}keys.left=keys.right=keys.jump=false;padJump=false;digHold=false;last=0;acc=0;document.querySelectorAll('.on').forEach(el=>el.classList.remove('on'))});

// スタートボタン（click で開始：iPhoneの音もこの操作で鳴らせる）
document.getElementById('startBtn').addEventListener('click',e=>{e.stopPropagation();startGame()});

// 音楽ON/OFFボタン（設定は次回も保持）
const mb=document.getElementById('music');
function setMusic(on){musicOn=on;mb.textContent=on?'🎵':'🔇';mb.classList.toggle('off',!on);try{localStorage.setItem('skyhop-music',on?'on':'off')}catch(_){}if(bgmBus&&audioCtx)bgmBus.gain.setTargetAtTime(on?1:0,audioCtx.currentTime,.02)}
mb.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();unlockAudio();setMusic(!musicOn)});
setMusic(musicOn);

// あらかじめ用意したMP3とオリジナルBGMを切り替える。
const changeBgm=document.getElementById('changeBgm');
function updateBgmButton(){
  const current=mp3Enabled?'MP3':'元のBGM',action=mp3Enabled?'元のBGMに戻す':'MP3に切替';
  changeBgm.replaceChildren();
  const status=document.createElement('small');status.textContent='現在：'+current;
  changeBgm.append(status,document.createTextNode('♫ '+action));
  changeBgm.setAttribute('aria-label',action+'。現在は'+current);
  changeBgm.setAttribute('aria-pressed',String(mp3Enabled));
}
changeBgm.addEventListener('click',e=>{
  e.stopPropagation();unlockAudio();
  if(mp3Cur){mp3Halt(mp3Cur);mp3Cur=null}
  mp3Enabled=!mp3Enabled;
  try{localStorage.setItem('dig-hop-mp3',mp3Enabled?'on':'off')}catch(_){}
  curSong=null;bgmNext=0;bgmStep=0;
  if(mp3Enabled)setMusic(true);
  updateBgmButton();bgmTick();
});
updateBgmButton();

// 全画面ボタン（対応端末のみ：主にAndroid）
const fs=document.getElementById('fs'),root=document.documentElement;
if(root.requestFullscreen&&document.fullscreenEnabled){fs.style.display='block';fs.addEventListener('click',async()=>{try{await root.requestFullscreen();await screen.orientation?.lock?.('landscape')}catch(_){}});document.addEventListener('fullscreenchange',()=>fs.style.display=document.fullscreenElement?'none':'block')}
</script></body></html>
